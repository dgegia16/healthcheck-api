name: CI

on:
    push:
        branches: [main]
        
        
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - run: pip install -r requirements.txt

            - run: |
                uvicorn main:app &
                sleep 2
                curl -f http://localhost:8000/health
    docker: 
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build Docker image 
              run: docker build -t healthcheck-api .

            - name: Test container 
              run: | 
                docker run -d --name hc-test -p 8000:8000 healthcheck-api
                sleep 3
                curl -f http://localhost:8000/health/live
                docker stop hc-test